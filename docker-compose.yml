services:
  gemini-free-api:
    build: .
    container_name: gemini-free-api
    ports:
      - "8080:8080"
    environment:
      # Paste your Google cookies here (JSON list form), or leave empty
      # and use a bind-mounted .env instead. Guest mode needs no cookies.
      GEMINI_COOKIES: ""
      AUTH_TOKEN: "gemini"
      AGENT_MODE: "true"
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
